name: foundit_app
description: "FOUNDIT - A Smart Campus Lost & Found System for GCET"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase Core
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  
  # Cloudinary for image storage (replaces Firebase Storage)
  cloudinary_public: ^0.21.0
  
  # Google Sign-In
  google_sign_in: ^6.2.1
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # UI & Images
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  
  # Utilities
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  
  # Notifications
  flutter_local_notifications: ^18.0.1
  
  # Splash & UI
  flutter_native_splash: ^2.4.1
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
